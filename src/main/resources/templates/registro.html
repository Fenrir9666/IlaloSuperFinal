<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ilaló Suculentas</title>
    
    <!-- BOOTSTRAP 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 🌟 ENLACE A TU ARCHIVO DE ESTILOS PRINCIPAL -->
<link rel="stylesheet" th:href="@{/estilos.css}">

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <!-- 🎨 Manchas de acuarela sueltas en el fondo -->
    <div class="mancha-fondo-login mancha-uno d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-dos d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-tres d-none d-lg-block"></div>

    <!-- 🌵 Dibujo del Cactus (Izquierda) -->
    <img th:src="@{/img/cactus1-izq.png}" alt="Cactus Decorativo" class="img-decorativa-login decorativa-izq d-none d-lg-block">

    <!-- Tarjeta de Registro -->
    <div class="card shadow my-4" style="width: 100%; max-width: 500px; border-radius: 15px; position: relative; z-index: 2;">
        <div class="card-body p-4">
           
            <!-- 🌵 LOGOTIPO OFICIAL CON LETRA POPPINS -->
            <div class="text-center mb-4 login-header-brand">
                <div class="d-flex align-items-center justify-content-center mb-2 branding-wrapper">
                    <img th:src="@{/img/logoSucu.png}" 
                         alt="Logo Ilaló Suculentas" 
                         width="40" 
                         height="40" 
                         class="me-2 brand-logo-circle">
                    <h3 class="brand-text-title mb-0">Ilaló Suculentas</h3>
                </div>
                <p class="text-muted small mb-0">Completa los campos para unirte a la tienda</p>
            </div>


            <!-- Alerta si el email ya existe -->
            <div th:if="${param.error == 'emailDuplicado'}" class="alert alert-danger py-2" role="alert" style="font-size: 0.9rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> El correo electrónico ya está registrado.
            </div>

            <!-- Alerta si el registro fue exitoso -->
            <div th:if="${param.registroExitoso}" class="alert alert-success py-2" role="alert" style="font-size: 0.9rem;">
                <i class="bi bi-check-circle-fill me-2"></i> Registro completado con éxito. Ahora puedes iniciar sesión.
            </div>

            <!-- Formulario -->
           <!-- Formulario de Registro Compacto y Elegante -->
<form th:action="@{/registro}" method="post" class="w-100 text-start login-header-brand" style="font-size: 0.85rem;">
    
    <!-- Fila 1: Nombre y Apellido juntos -->
    <div class="row g-2 mb-2">
        <div class="col-6">
            <label for="nombre" class="form-label mb-1 fw-semibold">Nombre</label>
            <input type="text" class="form-control form-control-sm login-input-compact" id="nombre" name="nombre" required placeholder="Tu nombre">
        </div>
        <div class="col-6">
            <label for="apellido" class="form-label mb-1 fw-semibold">Apellido</label>
            <input type="text" class="form-control form-control-sm login-input-compact" id="apellido" name="apellido" required placeholder="Tu apellido">
        </div>
    </div>

    <!-- Campo: Correo Electrónico -->
    <div class="mb-2">
        <label for="email" class="form-label mb-1 fw-semibold">Correo Electrónico</label>
        <input type="email" class="form-control form-control-sm login-input-compact" id="email" name="email" required placeholder="correo@ejemplo.com">
    </div>

    <!-- Campo: Contraseña -->
    <div class="mb-2">
        <label for="password" class="form-label mb-1 fw-semibold">Contraseña</label>
        <input type="password" class="form-control form-control-sm login-input-compact" id="password" name="password" required placeholder="Mínimo 6 caracteres">
    </div>

    <!-- Campo: Teléfono -->
    <div class="mb-2">
        <label for="telefono" class="form-label mb-1 fw-semibold">Teléfono</label>
        <input type="text" class="form-control form-control-sm login-input-compact" id="telefono" name="telefono" required placeholder="Ej: 0999999999">
    </div>

    <!-- Campo: Dirección de Entrega -->
    <div class="mb-3">
        <label for="direccion" class="form-label mb-1 fw-semibold">Dirección de Entrega</label>
        <input type="text" class="form-control form-control-sm login-input-compact" id="direccion" name="direccion" required placeholder="Calle, Ciudad, Sector">
    </div>

    <!-- Botón de Envío Reducido -->
    <button type="submit" class="btn w-100 text-white fw-bold py-2 mb-2 shadow-sm" style="background-color: #2e7d32; border-radius: 10px; font-size: 0.9rem;">
        Registrarse
    </button>
</form>


            <div class="text-center border-top pt-3" style="font-size: 0.9rem;">
                <span>¿Ya tienes cuenta? </span>
                <a th:href="@{/login}" class="fw-semibold text-decoration-none" style="color: #2e7d32;">Inicia sesión</a>
            </div>
        </div>
    </div>

   <!-- 🌿 Dibujo de Planta Colgante (Derecha) -->
    <img th:src="@{/img/cactus1-der.png}" alt="Planta Decorativa" class="img-decorativa-login decorativa-der d-none d-lg-block">



</body>
</html>
