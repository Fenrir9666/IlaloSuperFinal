<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Ilaló Suculentas</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Tus estilos -->
    <link rel="stylesheet" th:href="@{/estilos.css}">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">

    <!-- Manchas decorativas -->
    <div class="mancha-fondo-login mancha-uno d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-dos d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-tres d-none d-lg-block"></div>

    <!-- Cactus izquierdo -->
    <img th:src="@{/img/cactus1-izq.png}"
         alt="Cactus Decorativo"
         class="img-decorativa-login decorativa-izq d-none d-lg-block">

    <!-- Tarjeta -->
    <div class="card shadow my-4"
         style="width:100%; max-width:500px; border-radius:15px; position:relative; z-index:2;">

        <div class="card-body p-4">

            <!-- Logo -->
            <div class="text-center mb-4 login-header-brand">

                <div class="d-flex align-items-center justify-content-center mb-2 branding-wrapper">

                    <img th:src="@{/img/logoSucu.png}"
                         alt="Logo Ilaló Suculentas"
                         width="40"
                         height="40"
                         class="me-2 brand-logo-circle">

                    <h3 class="brand-text-title mb-0">
                        Ilaló Suculentas
                    </h3>

                </div>

                <p class="text-muted small mb-0">
                    Completa los campos para unirte a la tienda
                </p>

            </div>

            <!-- Error correo duplicado -->
            <div th:if="${errorEmail}"
                 class="alert alert-danger py-2"
                 role="alert"
                 style="font-size:0.9rem;">

                <i class="bi bi-exclamation-triangle-fill me-2"></i>

                <span th:text="${errorEmail}"></span>

            </div>

            <!-- Formulario -->
           <!-- Formulario -->
<form th:action="@{/registro}"
      th:object="${usuario}"
      method="post"
      class="w-100 text-start login-header-brand"
      style="font-size:0.85rem;">

    <!-- Nombre y apellido -->
    <div class="row g-2 mb-2">
        <!-- Nombre -->
        <div class="col-6">
            <label for="nombre" class="form-label mb-1 fw-semibold">Nombre</label>
            <input type="text"
                   th:field="*{nombre}"
                   class="form-control form-control-sm login-input-compact"
                   th:errorclass="is-invalid"
                   id="nombre"
                   placeholder="Tu nombre">
            <div th:if="${#fields.hasErrors('nombre')}"
                 th:errors="*{nombre}"
                 class="text-danger small fw-bold mt-1"
                 style="font-size: 0.75rem; line-height: 1.2;">
            </div>
        </div>

        <!-- Apellido -->
        <div class="col-6">
            <label for="apellido" class="form-label mb-1 fw-semibold">Apellido</label>
            <input type="text"
                   th:field="*{apellido}"
                   class="form-control form-control-sm login-input-compact"
                   th:errorclass="is-invalid"
                   id="apellido"
                   placeholder="Tu apellido">
            <div th:if="${#fields.hasErrors('apellido')}"
                 th:errors="*{apellido}"
                 class="text-danger small fw-bold mt-1"
                 style="font-size: 0.75rem; line-height: 1.2;">
            </div>
        </div>
    </div>

    <!-- Email -->
    <div class="mb-2">
        <label for="email" class="form-label mb-1 fw-semibold">Correo Electrónico</label>
        <input type="email"
               th:field="*{email}"
               class="form-control form-control-sm login-input-compact"
               th:errorclass="is-invalid"
               id="email"
               placeholder="correo@ejemplo.com">
        <div th:if="${#fields.hasErrors('email')}"
             th:errors="*{email}"
             class="text-danger small fw-bold mt-1"
             style="font-size: 0.75rem; line-height: 1.2;">
        </div>
    </div>

    <!-- Contraseña -->
    <div class="mb-2">
        <label for="password" class="form-label mb-1 fw-semibold">Contraseña</label>
        <input type="password"
               th:field="*{password}"
               class="form-control form-control-sm login-input-compact"
               th:errorclass="is-invalid"
               id="password"
               placeholder="Mínimo 8 caracteres">
        <div th:if="${#fields.hasErrors('password')}"
             th:errors="*{password}"
             class="text-danger small fw-bold mt-1"
             style="font-size: 0.75rem; line-height: 1.2;">
        </div>
    </div>

        <!-- Teléfono -->
    <div class="mb-2">
        <label for="telefono" class="form-label mb-1 fw-semibold">Teléfono</label>
        <input type="text"
               th:field="*{telefono}"
               class="form-control form-control-sm login-input-compact"
               th:errorclass="is-invalid"
               id="telefono"
               placeholder="0999999999">
        <div th:if="${#fields.hasErrors('telefono')}"
             th:errors="*{telefono}"
             class="text-danger small fw-bold mt-1"
             style="font-size: 0.75rem; line-height: 1.2;">
        </div>
    </div>

    <!-- Dirección -->
    <div class="mb-3">
        <label for="direccion" class="form-label mb-1 fw-semibold">Dirección de Entrega</label>
        <input type="text"
               th:field="*{direccion}"
               class="form-control form-control-sm login-input-compact"
               th:errorclass="is-invalid"
               id="direccion"
               placeholder="Calle, Ciudad, Sector">
        <div th:if="${#fields.hasErrors('direccion')}"
             th:errors="*{direccion}"
             class="text-danger small fw-bold mt-1"
             style="font-size: 0.75rem; line-height: 1.2;">
        </div>
    </div>


    <!-- Botón -->
    <button type="submit"
            class="btn w-100 text-white fw-bold py-2 mb-2 shadow-sm"
            style="background-color:#2e7d32; border-radius:10px; font-size:0.9rem;">
        Registrarse
    </button>
</form>


            <!-- Ir al login -->
            <div class="text-center border-top pt-3"
                 style="font-size:0.9rem;">

                <span>¿Ya tienes cuenta?</span>

                <a th:href="@{/login}"
                   class="fw-semibold text-decoration-none"
                   style="color:#2e7d32;">

                    Inicia sesión

                </a>

            </div>

        </div>

    </div>

    <!-- Cactus derecho -->
    <img th:src="@{/img/cactus1-der.png}"
         alt="Planta Decorativa"
         class="img-decorativa-login decorativa-der d-none d-lg-block">

</body>
</html>
