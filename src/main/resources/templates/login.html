<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ilaló Suculentas</title>

    <!-- BOOTSTRAP 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- BOOTSTRAP ICONS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <!-- 🌟 ENLACE A TU ARCHIVO DE ESTILOS PRINCIPAL -->
    <link rel="stylesheet" th:href="@{/estilos.css}">

    <!-- BOOTSTRAP JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">


 <!-- 🎨 Manchas de acuarela sueltas en el fondo -->
    <div class="mancha-fondo-login mancha-uno d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-dos d-none d-lg-block"></div>
    <div class="mancha-fondo-login mancha-tres d-none d-lg-block"></div>


    <!-- 🌵 Dibujo del Cactus (Izquierda) -->
    <img th:src="@{/img/cactus-izq.png}" alt="Cactus Decorativo" class="img-decorativa-login decorativa-izq d-none d-lg-block">

 

    <div class="card shadow" style="width: 100%; max-width: 400px; border-radius: 15px;">
        <div class="card-body p-4">
           
            <!-- 🌵 LOGOTIPO OFICIAL CON LETRA POPPINS -->
            <div class="text-center mb-4 login-header-brand">
                <div class="d-flex align-items-center justify-content-center mb-2 branding-wrapper">
                    <img th:src="@{/img/logoSucu.png}" 
                         alt="Logo Ilaló Suculentas" 
                         width="40" 
                         height="40" 
                         class="me-2 brand-logo-circle">
                    <h3 class="brand-text-title mb-0">Ilaló Suculentas</h3>
                </div>
                <p class="text-muted small mb-0">Ingresa tus datos para continuar</p>
            </div>

            <!-- Alerta si las credenciales son incorrectas -->
            <div th:if="${param.error}" class="alert alert-danger py-2" role="alert" style="font-size: 0.9rem;">
                <i class="bi bi-exclamation-triangle-fill me-2"></i> Correo o contraseña inválidos.
            </div>

            <!-- Alerta si cerró sesión -->
            <div th:if="${param.logout}" class="alert alert-success py-2" role="alert" style="font-size: 0.9rem;">
                Sesión cerrada correctamente.
            </div>

            <!-- Formulario de login -->
            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label fw-medium">Correo Electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-medium">Contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn w-100 text-white fw-bold mb-3" style="background-color: #2e7d32; border-radius: 8px;">
                    Iniciar Sesión
                </button>
            </form>

            <div class="text-center border-top pt-3" style="font-size: 0.9rem;">
                <span>¿No tienes una cuenta?</span>
                <a th:href="@{/registro}" class="fw-semibold text-decoration-none" style="color: #2e7d32;">Regístrate aquí</a>
            </div>
        </div>
    </div>


   <!-- 🌿 Dibujo de Planta Colgante (Derecha) -->
    <img th:src="@{/img/cactus-der.png}" alt="Planta Decorativa" class="img-decorativa-login decorativa-der d-none d-lg-block">





</body>
</html>
