<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>¡Ups! Hay un problema</title>
    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
    <div class="ticket-box" style="text-align: center; max-width: 500px;">
        <h1 style="color: #d32f2f; font-size: 3rem; margin-bottom: 10px;">🌵💨</h1>
        <h2 th:text="${titulo}" style="color: var(--verde-oscuro);">Título del Error</h2>
        <p th:text="${mensaje}" style="color: var(--gris-texto); margin: 20px 0; line-height: 1.6;"></p>
        
        <div class="links-navegacion" style="margin-top: 25px;">
            <a th:href="@{/}" class="btn-pago-exito" style="text-decoration: none; display: inline-block; color: white;">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
